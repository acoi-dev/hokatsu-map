<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 30%, #A5D6A7 70%, #81C784 100%);
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  position: relative;
}

/* 装飾 */
.bg-circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0.12;
}
.bg-circle.c1 { width: 400px; height: 400px; background: #4CAF50; top: -100px; right: -50px; }
.bg-circle.c2 { width: 300px; height: 300px; background: #66BB6A; bottom: -80px; left: -60px; }
.bg-circle.c3 { width: 200px; height: 200px; background: #388E3C; top: 50%; left: 60%; }

.card {
  background: rgba(255,255,255,0.95);
  border-radius: 24px;
  padding: 60px 80px;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  max-width: 1000px;
  position: relative;
  z-index: 1;
}

.emoji { font-size: 64px; margin-bottom: 16px; }

.title {
  font-size: 56px;
  font-weight: 900;
  color: #2E7D32;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 26px;
  font-weight: 600;
  color: #555;
  margin-bottom: 28px;
}

.features {
  display: flex;
  gap: 32px;
  justify-content: center;
}

.feature {
  background: #F1F8E9;
  border-radius: 12px;
  padding: 16px 24px;
  font-size: 18px;
  font-weight: 600;
  color: #33691E;
}

.domain {
  margin-top: 24px;
  font-size: 18px;
  color: #888;
  font-weight: 500;
}
</style>
</head>
<body>
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>

  <div class="card">
    <div class="emoji">🏫</div>
    <div class="title">保育園探し</div>
    <div class="subtitle">保育園、入れる？がすぐわかる</div>
    <div class="features">
      <div class="feature">☀️ 入園可能性</div>
      <div class="feature">📊 空き推移</div>
      <div class="feature">🔢 点数計算</div>
    </div>
    <div class="domain">hoimii.jp</div>
  </div>
</body>
</html>
